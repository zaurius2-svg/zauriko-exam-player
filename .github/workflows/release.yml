name: Release Build & Multiplatform Packaging

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-desktop:
    name: Build Desktop (Windows, macOS, Linux)
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows/amd64
            artifact_name: ZaurikoExamSim-Windows-amd64.exe
            build_cmd: wails build -platform windows/amd64 -s -windowsconsole=false -o ZaurikoExamSim-Windows-amd64.exe
            output_path: build/bin/ZaurikoExamSim-Windows-amd64.exe

          - os: ubuntu-latest
            platform: linux/amd64
            artifact_name: ZaurikoExamSim-Linux-amd64
            build_cmd: wails build -platform linux/amd64 -s -o ZaurikoExamSim-Linux-amd64
            output_path: build/bin/ZaurikoExamSim-Linux-amd64

          - os: macos-latest
            platform: darwin/universal
            artifact_name: ZaurikoExamSim-macOS-Universal.zip
            build_cmd: wails build -platform darwin/universal -s
            output_path: build/bin/ZaurikoExamSim-macOS-Universal.zip

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Linux Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.1

      - name: Install Frontend Dependencies & Build
        run: |
          cd frontend
          npm ci
          npm run build
          cd ..

      - name: Build Application with Wails
        run: ${{ matrix.build_cmd }}

      - name: Zip macOS App Bundle
        if: runner.os == 'macOS'
        run: |
          cd build/bin
          zip -r ZaurikoExamSim-macOS-Universal.zip "exam-player.app"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.output_path }}

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Frontend & Sync Capacitor
        run: |
          cd frontend
          npm ci
          npm run build
          npx cap sync android

      - name: Build Android APK with Gradle
        run: |
          cd frontend/android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: ZaurikoExamSim-Android.apk
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk

  publish-release:
    name: Create GitHub Release
    needs: [build-desktop, build-android]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Create GitHub Release with Artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/**/*
          generate_release_notes: true
